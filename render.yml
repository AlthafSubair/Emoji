services:
  - name: emoji-backend
    type: web
    env: docker
    plan: free
    repo: https://github.com/AlthafSubair/Emoji
    region: oregon
    healthCheckPath: /health
    dockerContext: ./server  # Ensure it builds from the `server` directory
    dockerfilePath: ./server/Dockerfile  # Explicit path to `Dockerfile`
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false

  - name: emoji-caddy
    type: web
    env: docker
    plan: free
    repo: https://github.com/AlthafSubair/Emoji
    region: oregon
    dockerContext: ./caddy  # Ensure correct build context
    dockerfilePath: ./caddy/Dockerfile  # Explicit path to `Dockerfile`
    envVars:
      - key: CADDYFILE
        value: /etc/caddy/Caddyfile

  - name: emoji-app
    type: web
    env: docker
    plan: free
    repo: https://github.com/AlthafSubair/Emoji
    region: oregon
    dockerContext: .  # Root directory (leave empty if needed)
    dockerComposeFile: docker-compose.yml  # Use `docker-compose`


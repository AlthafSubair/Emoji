version: '3.8'
  services:
    mongo:
      image: mongo:5.0.23
      volumes:
        - mongo_data:/data/db  
      networks:
        - emoji
  
    api:
      build:
        context: ./server
        target: production
      restart: unless-stopped
      env_file: ./server/.env
      networks:
        - emoji
      depends_on:
        - mongo
  
    client:
      build:
        context: ./client
        target: production
        args:
          VITE_API_URL: https://api.${DOMAIN_NAME}
      restart: unless-stopped
      networks:
        - emoji
      depends_on:
        - api
  
    caddy:
      build:
        context: ./caddy
        dockerfile: Dockerfile
      ports:
        - 80:80
        - 443:443
      environment:
        DOMAIN_NAME: ${DOMAIN_NAME}
      volumes:
        - caddy_data:/data
        - caddy_config:/config
        - ./caddy/Caddyfile.template:/etc/caddy/Caddyfile.template  # Mount template
      networks:
        - emoji
      depends_on:
        - api
        - client
      entrypoint: ["/bin/sh", "-c", "envsubst < /etc/caddy/Caddyfile.template > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile"]
  
  volumes:
    mongo_data:
    caddy_data:
    caddy_config:
  
  networks:
    emoji:
      driver: bridge




version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - database

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server

  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client
